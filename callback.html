  <h1>Tesla OAuth Callback</h1>
  <p>Nach dem Tesla-Login wirst du hierher weitergeleitet. Die URL enthält einen Parameter <code>code</code>.</p>
  <p>Kopiere die komplette URL aus der Adresszeile (z. B. <code>https://username.github.io/tesla-oauth-callback/callback.html?code=XYZ</code>) und füge sie im Python-Skript ein.</p>
